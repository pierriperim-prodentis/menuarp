<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atualizar Painel do Mês — Pródentis/ARP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap');
:root{
  --purple:#9C27B0;--pd:#6A1B9A;--cyan:#00BCD4;
  --bg:#F7F4FB;--surface:#fff;--surface2:#F0EBF8;
  --text:#1A0A2E;--text-muted:#6B5B82;
  --green:#2ECC71;--red:#E74C3C;--amber:#F39C12;
  --border:#E0D6ED;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;padding-bottom:60px;}
#hdr{background:linear-gradient(135deg,#4A148C,#9C27B0);padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 4px 16px rgba(106,27,154,.3);position:sticky;top:0;z-index:50;}
#hdr h1{font-family:'Space Grotesk',sans-serif;font-size:18px;color:#fff;display:flex;align-items:center;gap:8px;}
#hdr .sub{color:rgba(255,255,255,.75);font-size:12px;margin-top:2px;}
#dataField{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;}
#dataField::-webkit-calendar-picker-indicator{filter:invert(1);}

#app{max-width:900px;margin:0 auto;padding:20px;display:none;}

.card{background:var(--surface);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(106,27,154,.06);border:1px solid var(--border);}
.card h3{font-family:'Space Grotesk',sans-serif;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--pd);}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);}

.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:760px){.grid6{grid-template-columns:repeat(2,1fr);}.grid4{grid-template-columns:repeat(2,1fr);}}

.field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.field input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface2);font-family:'Inter',sans-serif;}
.field input:focus{outline:2px solid var(--purple);outline-offset:1px;background:#fff;}

#saveBar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:14px 20px;display:flex;justify-content:center;align-items:center;gap:14px;box-shadow:0 -4px 16px rgba(0,0,0,.06);z-index:50;}
#saveBtn{background:var(--purple);color:#fff;border:none;padding:12px 32px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;}
#saveBtn:disabled{opacity:.6;cursor:default;}
#saveBtn:hover:not(:disabled){background:var(--pd);}
#status{font-size:13px;font-weight:600;}
#status.ok{color:var(--green);}
#status.err{color:var(--red);}
#status.busy{color:var(--amber);}

.section-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:20px 0 10px;padding-left:2px;}
</style>
</head>
<body>

<div id="hdr">
  <div>
    <h1>📝 Atualizar Painel do Mês</h1>
    <div class="sub">Pródentis/ARP — os valores salvos aqui aparecem automaticamente no painel</div>
  </div>
  <input type="date" id="dataField">
</div>

<div id="app">
  <div class="section-label">Assessores</div>
  <div id="assessoresWrap"></div>

  <div class="section-label">Lojas</div>
  <div id="lojasWrap"></div>
</div>

<div id="saveBar" style="display:none">
  <span id="status"></span>
  <button id="saveBtn" onclick="salvar()">💾 Salvar e Publicar</button>
</div>

<script>
var JSONBIN_ID='6a84b2f1f5f4af5e2925aa5f';
var JSONBIN_KEY='$2a$10$kDShjgaHn/S8k124l8ehU.lw9To/Dt0VHer/KXhF6XMT2CvljlxKm';

var ASSESSORES=['Bruna','Luana','Made','Diego','Francely','Lizia','Jarlene'];
var ASSESSORES_LABEL={'Bruna':'Bruna','Luana':'Luana','Made':'Madê','Diego':'Diego','Francely':'Francely','Lizia':'Lizia','Jarlene':'Jarlene'};
var LOJAS=['PMW','SLZ','ITZ'];

function iniciarDireto(){
  document.getElementById('app').style.display='block';
  document.getElementById('saveBar').style.display='flex';
  iniciar();
}

function hoje(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function campo(id,label,value,step){
  return '<div class="field"><label>'+label+'</label><input type="number" step="'+(step||'0.01')+'" id="'+id+'" value="'+(value!==undefined?value:'')+'"></div>';
}

function montarFormularios(dados){
  var aWrap=document.getElementById('assessoresWrap');
  aWrap.innerHTML=ASSESSORES.map(function(nome){
    var a=(dados.assessores&&dados.assessores[nome])||{};
    return '<div class="card"><h3><span class="dot"></span>'+ASSESSORES_LABEL[nome]+'</h3>'+
      '<div class="grid6">'+
        campo('a_'+nome+'_pmw','Loja PMW',a.pmw)+
        campo('a_'+nome+'_slz','Loja SLZ',a.slz)+
        campo('a_'+nome+'_itz','Loja ITZ',a.itz)+
        campo('a_'+nome+'_fab','Fábrica',a.fab)+
        campo('a_'+nome+'_meta','Meta',a.meta)+
        campo('a_'+nome+'_mc','%MC',a.mc,'0.01')+
      '</div></div>';
  }).join('');

  var lWrap=document.getElementById('lojasWrap');
  lWrap.innerHTML=LOJAS.map(function(loja){
    var l=(dados.lojas&&dados.lojas[loja])||{};
    return '<div class="card"><h3><span class="dot"></span>Loja '+loja+'</h3>'+
      '<div class="grid4">'+
        campo('l_'+loja+'_loja','Loja (total)',l.loja)+
        campo('l_'+loja+'_fab','Fábrica',l.fab)+
        campo('l_'+loja+'_meta','Meta',l.meta)+
        campo('l_'+loja+'_mc','%MC',l.mc,'0.01')+
      '</div></div>';
  }).join('');
}

var HISTORICO_CACHE={};

function iniciar(){
  document.getElementById('dataField').value=hoje();
  setStatus('Carregando últimos valores...','busy');
  fetch('https://api.jsonbin.io/v3/b/'+JSONBIN_ID+'/latest',{headers:{'X-Master-Key':JSONBIN_KEY}})
    .then(function(r){return r.json();})
    .then(function(json){
      var rec=(json&&json.record)||{};
      HISTORICO_CACHE=rec.historico||{};
      var datas=Object.keys(HISTORICO_CACHE).sort();
      var dataMaisRecente=datas.length?datas[datas.length-1]:hoje();
      document.getElementById('dataField').value=dataMaisRecente;
      montarFormularios(HISTORICO_CACHE[dataMaisRecente]||{});
      setStatus('','');
    })
    .catch(function(e){
      console.warn('Falha ao carregar dados anteriores',e);
      montarFormularios({});
      setStatus('Não consegui carregar os últimos valores — comece do zero.','err');
    });
}

document.getElementById('dataField').addEventListener('change',function(){
  var d=this.value;
  montarFormularios(HISTORICO_CACHE[d]||{});
  setStatus(HISTORICO_CACHE[d]?'Editando dados já salvos de '+d.split('-').reverse().join('/'):'Data nova — formulário em branco.','');
});

function setStatus(msg,cls){
  var el=document.getElementById('status');
  el.textContent=msg;
  el.className=cls||'';
}

function num(id){
  var el=document.getElementById(id);
  var v=el?parseFloat(el.value):0;
  return isNaN(v)?0:v;
}

function salvar(){
  var dataAlvo=document.getElementById('dataField').value;
  var snap={data:dataAlvo,assessores:{},lojas:{}};
  ASSESSORES.forEach(function(nome){
    snap.assessores[nome]={
      pmw:num('a_'+nome+'_pmw'),
      slz:num('a_'+nome+'_slz'),
      itz:num('a_'+nome+'_itz'),
      fab:num('a_'+nome+'_fab'),
      meta:num('a_'+nome+'_meta'),
      mc:num('a_'+nome+'_mc')
    };
  });
  LOJAS.forEach(function(loja){
    snap.lojas[loja]={
      loja:num('l_'+loja+'_loja'),
      fab:num('l_'+loja+'_fab'),
      meta:num('l_'+loja+'_meta'),
      mc:num('l_'+loja+'_mc')
    };
  });

  HISTORICO_CACHE[dataAlvo]=snap;

  document.getElementById('saveBtn').disabled=true;
  setStatus('Salvando...','busy');

  fetch('https://api.jsonbin.io/v3/b/'+JSONBIN_ID,{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY},
    body:JSON.stringify({historico:HISTORICO_CACHE})
  })
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(){
    setStatus('✔ Salvo (' +dataAlvo.split('-').reverse().join('/')+')! O painel já está atualizado.','ok');
    document.getElementById('saveBtn').disabled=false;
  })
  .catch(function(e){
    console.error(e);
    setStatus('Erro ao salvar — tenta de novo em instantes.','err');
    document.getElementById('saveBtn').disabled=false;
  });
}

iniciarDireto();
</script>
</body>
</html>
